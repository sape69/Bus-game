name: Build Bus Match Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Setup Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: |
          godot --version

      - name: Download known-good Android preset
        run: |
          curl -L \
            "https://raw.githubusercontent.com/Everyseok/core-breaker-godot/refs/heads/feature/android-debug-apk-artifact/export_presets.cfg" \
            -o export_presets.cfg

      - name: Convert Android preset for Bus Match
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text()

          start = text.index("[preset.1]")
          android = text[start:]

          replacements = {
              'name="Android Debug APK"':
                  'name="Android"',

              'runnable=false':
                  'runnable=true',

              'custom_features="android_debug_apk"':
                  'custom_features=""',

              'export_path="exports/android_debug/core_breaker_debug.apk"':
                  'export_path="build/BusMatch.apk"',

              'version/name="0.1-debug"':
                  'version/name="1.0"',

              'package/unique_name="com.junseokism.corebreaker.debug"':
                  'package/unique_name="com.busmatch.game"',

              'package/name="Core Breaker Debug"':
                  'package/name="Bus Match"',

              'launcher_icons/main_192x192="res://assets/branding/app_icon_600.png"':
                  'launcher_icons/main_192x192=""',

              'launcher_icons/adaptive_foreground_432x432="res://assets/branding/app_icon_600.png"':
                  'launcher_icons/adaptive_foreground_432x432=""',

              'permissions/vibrate=false':
                  'permissions/vibrate=true',
          }

          for old, new in replacements.items():
              android = android.replace(old, new)

          android = android.replace(
              "[preset.1]",
              "[preset.0]",
              1
          )

          android = android.replace(
              "[preset.1.options]",
              "[preset.0.options]",
              1
          )

          path.write_text(android)
          PY

      - name: Verify Android preset
        run: |
          echo "===== ANDROID PRESET ====="
          sed -n '1,330p' export_presets.cfg

      - name: Check project
        run: |
          godot \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Build Android APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/BusMatch.apk

      - name: Verify APK
        run: |
          echo "===== BUILD RESULT ====="
          ls -lah build

          test -f build/BusMatch.apk

          echo "======================================"
          echo "BUS MATCH APK BUILD SUCCESSFUL!"
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bus-Match-APK
          path: build/BusMatch.apk