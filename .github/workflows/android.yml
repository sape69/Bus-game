name: Build Bus Match Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: godot --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"

      - name: Create Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]

          filesystem/file_dialog/refresh_on_popup=true
          android/android_sdk_path="/usr/local/lib/android/sdk"
          android/java_sdk_path="$JAVA_HOME"
          EOF

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BusMatch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bus-Match-APK
          path: build/BusMatch.apk