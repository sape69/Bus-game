name: Build Bus Match Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: |
          godot --version

      - name: Create Android export preset
        run: |
          curl -L \
            "https://raw.githubusercontent.com/Safwan-Murad/Stellar-Highway/master/export_presets.cfg" \
            -o export_presets.cfg

      - name: Configure Bus Match Android preset
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text()

          # Use only the first Android preset.
          start = text.index("[preset.0]")
          end = text.index("[preset.1]")

          preset = text[start:end]

          # Change output to our APK.
          lines = []

          for line in preset.splitlines():
              if line.startswith("export_path="):
                  line = 'export_path="build/BusMatch.apk"'

              elif line.startswith("gradle_build/use_gradle_build="):
                  line = "gradle_build/use_gradle_build=false"

              elif line.startswith("gradle_build/export_format="):
                  line = "gradle_build/export_format=0"

              elif line.startswith("package/unique_name="):
                  line = 'package/unique_name="com.busmatch.game"'

              elif line.startswith("package/name="):
                  line = 'package/name="Bus Match"'

              elif line.startswith("package/signed="):
                  line = "package/signed=false"

              elif line.startswith("version/code="):
                  line = "version/code=1"

              elif line.startswith("version/name="):
                  line = 'version/name="1.0"'

              elif line.startswith("launcher_icons/main_192x192="):
                  line = 'launcher_icons/main_192x192=""'

              lines.append(line)

          preset = "\n".join(lines)

          final_text = (
              '[runnable_presets]\n'
              'Android="Android"\n\n'
              + preset
          )

          path.write_text(final_text)
          PY

      - name: Show Android preset
        run: |
          echo "===== export_presets.cfg ====="
          cat export_presets.cfg

      - name: Import Godot project
        run: |
          godot \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Build Android APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/BusMatch.apk

      - name: Verify APK
        run: |
          echo "===== BUILD RESULT ====="
          ls -lah build

          if [ ! -f "build/BusMatch.apk" ]; then
            echo "ERROR: BusMatch.apk was not created."
            exit 1
          fi

          echo "======================================"
          echo "BUS MATCH APK BUILD SUCCESSFUL!"
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bus-Match-APK
          path: build/BusMatch.apk