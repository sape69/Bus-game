name: Build Bus Match Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: |
          godot --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BusMatch.apk"
          patch_list=[]
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.busmatch.game"
          package/name="Bus Match"
          package/signed=false
          EOF

      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== PROJECT.GODOT ====="
          cat project.godot

          echo "===== EXPORT PRESETS ====="
          cat export_presets.cfg

      - name: Import project
        run: |
          godot --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/BusMatch.apk

      - name: Verify APK
        run: |
          echo "===== BUILD RESULT ====="
          ls -lah build

          if [ ! -f build/BusMatch.apk ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bus-Match-APK
          path: build/BusMatch.apk