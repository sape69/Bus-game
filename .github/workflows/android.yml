name: Build Bus Match Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: |
          godot --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"

      - name: Configure Godot Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]

          android/android_sdk_path="/usr/local/lib/android/sdk"
          android/java_sdk_path="$JAVA_HOME"
          EOF

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BusMatch.apk"
          patch_list=[]
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=1

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.busmatch.game"
          package/name="Bus Match"
          package/signed=false

          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=true

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          EOF

      - name: Show project
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 2 -type f | sort

          echo "===== EXPORT PRESET ====="
          cat export_presets.cfg

      - name: Import Godot project
        run: |
          godot --headless --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/BusMatch.apk

      - name: Verify APK
        run: |
          echo "===== APK RESULT ====="
          ls -lah build

          if [ ! -f "build/BusMatch.apk" ]; then
            echo "ERROR: BusMatch.apk was not created."
            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL!"
          echo "================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bus-Match-APK
          path: build/BusMatch.apk